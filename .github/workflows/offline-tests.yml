name: Offline SDK regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      VWX_BACKGROUND_MODE: "1"
      VWX_VW_VERSION: "2027"
      VWX_TRANSPORT: file
      VWX_CACHE_TTL: "0"
      DO_NOT_TRACK: "1"
    steps:
      # Source SHA-256 checks are byte-sensitive. Prevent Windows checkout from
      # converting tracked LF files into CRLF before provenance verification.
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp-server/requirements.txt

      - name: Install server dependencies for real MCP registration tests
        run: python -m pip install -r mcp-server/requirements.txt

      - name: Run offline tests
        run: |
          mkdir -p .audit/ci
          python -m unittest discover -s tests -v 2>&1 | tee .audit/ci/unittest.log

      - name: Check handwritten tool contracts and tags
        run: python tools/pruefe_konsistenz.py .

      - name: Check repository layout and documentation links
        run: python tools/check_repository.py

      - name: Check reproducible SDK coverage reports
        run: |
          python tools/sdk_test_matrix.py --check
          python tools/api_coverage.py --check

      - name: Build and validate a pending native plan without connecting
        run: |
          python tools/sdk_regression_suite.py --list
          python tools/sdk_regression_suite.py --document 'C:\SDK-tests\VWX-MCP-SDK-TEST-ci-offline.vwx' --run-id ci-offline --output .audit/ci/native-plan.json

      - name: Build pending routine batch plans without connecting
        run: python tools/run_sdk_regression_batch.py --document 'C:\SDK-tests\VWX-MCP-SDK-TEST-ci-offline.vwx' --plugin-dir .audit/ci/not-an-installed-bridge --run-id ci-batch-offline --output-dir .audit/ci/batch-plans

      - name: Upload offline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-diagnostics-${{ matrix.os }}
          path: |
            .audit/ci/unittest.log
            .audit/ci/native-plan.json
            .audit/ci/batch-plans/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      # Never pass --execute to a runner here: native execution mutates a running
      # Vectorworks document. These jobs need no host, SDK archive, or credentials.
